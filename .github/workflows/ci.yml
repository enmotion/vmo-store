name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: test/reports/unit/coverage
